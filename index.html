<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seminar Registration</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>IT Seminar Sign Up</h1>

<form id="registrationForm">

<p>
<label for="fullName">Full Name:</label><br>
<input id="fullName" type="text" aria-describedby="fullNameError">
<span class="err" id="fullNameError"></span>
</p>

<p>
<label for="studentNumber">Student Number:</label><br>
<input id="studentNumber" type="text" aria-describedby="studentNumberError">
<span class="err" id="studentNumberError"></span>
</p>

<p>
<label for="email">Email:</label><br>
<input id="email" type="email" aria-describedby="emailError">
<span class="err" id="emailError"></span>
</p>

<p>
<label for="mobileNumber">Mobile Number:</label><br>
<input id="mobileNumber" type="tel" aria-describedby="mobileNumberError">
<span class="err" id="mobileNumberError"></span>
</p>

<p>
<label for="password">Password:</label><br>
<input id="password" type="password" aria-describedby="passwordError">
<span class="note" id="passwordFeedback"></span>
<span class="err" id="passwordError"></span>
</p>

<p>
<label for="confirmPassword">Confirm Password:</label><br>
<input id="confirmPassword" type="password" aria-describedby="confirmPasswordError">
<span class="err" id="confirmPasswordError"></span>
</p>

<p>
<label for="course">Course:</label><br>
<select id="course" aria-describedby="courseError">
<option value="">Select your course</option>
<option value="BSIT">BSIT</option>
<option value="BSCS">BSCS</option>
</select>
<span class="err" id="courseError"></span>
</p>

<p>
<label for="terms"><input id="terms" type="checkbox" aria-describedby="termsError"> I agree to the terms and conditions</label>
<span class="err" id="termsError"></span>
</p>

<p>
<button id="registerBtn" type="submit">Register</button>
<button id="resetBtn" type="reset">Reset</button>
</p>

</form>

<h3 id="successMessage"></h3>

<div id="registrationSummary" hidden>
<h2>Your Details</h2>
<p>Name: <span id="summaryName"></span></p>
<p>Student Number: <span id="summaryStudentNumber"></span></p>
<p>Email: <span id="summaryEmail"></span></p>
<p>Mobile: <span id="summaryMobileNumber"></span></p>
<p>Course: <span id="summaryCourse"></span></p>
</div>

<script src="js/app.js"></script>
</body>
</html>
